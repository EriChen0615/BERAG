### model
model_name_or_path: google/gemma-4-E4B-it
image_max_pixels: 262144
video_max_pixels: 16384

### method
stage: beft
do_train: false
finetuning_type: lora
lora_target: all
lora_rank: 64
lora_alpha: 128
beft_hidden_state_offset: 0
beft_prior_loss_factor: 0.0
beft_prior_head_lr: 1.0e-6
beft_prior_modeling: mlp_head
beft_prior_head_num_layers: 2
beft_prior_head_proj_dim: 1024
beft_use_prior_head_loss: false

### dataset
dataset: infoseek_beft_k2_max32k
template: gemma4n
enable_thinking: false
cutoff_len: 35000
overwrite_cache: true
media_dir: /workspace/projects/BERAG/
preprocessing_num_workers: 8
preprocessing_batch_size: 32
dataloader_num_workers: 4
packing: false
neat_packing: false
tokenized_path: /workspace/projects/BERAG/outputs/tokenized/infoseek_beft_gemma4n_e4b_sample64000_cutoff35k
max_samples: 64000

### output
output_dir: saves/gemma-4-e4b-it/lora/infoseek/tokenize/beft
logging_steps: 10
overwrite_output_dir: true
report_to: none

### eval
val_size: 64

